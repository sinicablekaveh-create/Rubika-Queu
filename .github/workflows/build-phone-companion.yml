name: Build Rubika Phone Manager APK
on:
  push:
    branches:
      - feat/rubika-phone-manager-20261017
    paths:
      - 'phone-companion/**'
      - '.github/workflows/build-phone-companion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: phone-companion
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -s phone-companion/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging phone-companion/app/build/outputs/apk/debug/app-debug.apk | grep -E 'package:|application-label:'
          sha256sum phone-companion/app/build/outputs/apk/debug/app-debug.apk > phone-companion/app/build/outputs/apk/debug/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Rubika-Phone-Manager-v1.0.0-TEST-APK
          path: |
            phone-companion/app/build/outputs/apk/debug/app-debug.apk
            phone-companion/app/build/outputs/apk/debug/apk-sha256.txt
          if-no-files-found: error
          retention-days: 21
