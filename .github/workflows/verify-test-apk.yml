name: Verify Dedicated Rubika Test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prebuilt/Rubika-Queu-v1.0-test-signed-package.zip'
      - '.github/workflows/verify-test-apk.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract package
        run: |
          set -euo pipefail
          mkdir -p verified
          unzip -t prebuilt/Rubika-Queu-v1.0-test-signed-package.zip
          unzip -o -q prebuilt/Rubika-Queu-v1.0-test-signed-package.zip -d verified
          test -s verified/Rubika-Queu-v1.0-scheduled-test-signed.apk
      - name: Check APK checksum
        run: |
          echo 'efde2e6fd5f9fb946e4bf588b8fe1dfc10a0eba443604911c5825cb7c0813881  verified/Rubika-Queu-v1.0-scheduled-test-signed.apk' | sha256sum -c -
      - name: Android apksigner verification
        run: |
          set -euo pipefail
          APK=verified/Rubika-Queu-v1.0-scheduled-test-signed.apk
          TOOL="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$TOOL"
          "$TOOL" verify --verbose --print-certs --min-sdk-version 26 "$APK" | tee signature-result.txt
          grep -qi '8747838d913e2f0f58dc66e432eb3753bc826e6a3f7e23eaf6bb799cd63af28b' signature-result.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
      - name: Upload verified test APK
        uses: actions/upload-artifact@v4
        with:
          name: Rubika-Queu-v1.0-scheduled-test-signed-apk
          path: verified/Rubika-Queu-v1.0-scheduled-test-signed.apk
          if-no-files-found: error
