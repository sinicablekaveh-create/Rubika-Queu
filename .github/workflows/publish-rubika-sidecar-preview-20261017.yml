name: Publish pinned rubika APK v1.4.0-sidecar-preview-20261017
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-rubika-sidecar-preview-20261017.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact successful source workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/38996591821" --jq .conclusion)" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/38996591821" --jq .head_sha)" = "e4079be357e569c2e6f4ea9d823239451bf732c3"
      - name: Download pinned workflow artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 38996591821
          artifact-ids: 12087571010
          merge-multiple: true
          path: staging
          github-token: ${{ github.token }}
      - name: Verify exact APK digest before publication
        shell: bash
        run: |
          set -euo pipefail
          test -s 'staging/Rubika-Queu-v1.4.0-SIDECAR-NEW-INSTALL-TEST.apk'
          echo 'fa083aaa2b0856223f55cb8f6e1cd88cd9f20dd37eb0966b91b9e7f9cc7c198e  staging/Rubika-Queu-v1.4.0-SIDECAR-NEW-INSTALL-TEST.apk' | sha256sum --check --status
      - name: Publish new explicit test prerelease (never overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 'v1.4.0-sidecar-preview-20261017' >/dev/null 2>&1; then
            echo "::error::Release tag already exists, refusing to overwrite assets."
            exit 1
          fi
          cat > release-notes.md <<'RELEASE_NOTES'
TEST-ONLY SIDE-BY-SIDE APK. Package ir.sinicable.rubikaqueue.sidecar, versionCode 18, disposable Android debug certificate. NOT an update for ir.sinicable.rubikaqueue or previously installed sidecars. Do not uninstall or clear data of the original Rubika queue. Selected Hooshika results enter only an isolated review inbox, never the sending queue. No actual on-device installation or message sending was performed. APK SHA-256: fa083aaa2b0856223f55cb8f6e1cd88cd9f20dd37eb0966b91b9e7f9cc7c198e. CI: https://github.com/sinicablekaveh-create/Rubika-Queu/actions/runs/38996591821.
RELEASE_NOTES
          gh release create 'v1.4.0-sidecar-preview-20261017' 'staging/Rubika-Queu-v1.4.0-SIDECAR-NEW-INSTALL-TEST.apk#Rubika-Queu-v1.4.0-SIDECAR-TEST.apk' \
            --target 'e4079be357e569c2e6f4ea9d823239451bf732c3' \
            --title 'Rubika-Queu 1.4.0 — sidecar test preview (NOT UPDATABLE)' \
            --notes-file release-notes.md --prerelease --latest=false
