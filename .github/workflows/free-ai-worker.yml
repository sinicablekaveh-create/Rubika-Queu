name: Test Free AI Gateway

on:
  pull_request:
    paths:
      - 'free-ai-worker/**'
      - 'tests/free-ai-worker.test.mjs'
      - '.github/workflows/free-ai-worker.yml'
  push:
    branches: [main]
    paths:
      - 'free-ai-worker/**'
      - 'tests/free-ai-worker.test.mjs'
      - '.github/workflows/free-ai-worker.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test authenticated free AI draft adapter without provider calls
        run: node --test tests/free-ai-worker.test.mjs
