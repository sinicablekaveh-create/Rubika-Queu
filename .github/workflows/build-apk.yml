name: Build Rubika Queu Test APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Extract audited application source bundle
        run: |
          set -euo pipefail
          test -s source/Rubika-Queu-v1.1-personal-queue-source.zip
          mkdir -p "$RUNNER_TEMP/rubika-src"
          unzip -o -q source/Rubika-Queu-v1.1-personal-queue-source.zip -d "$RUNNER_TEMP/rubika-src"
          cp -a "$RUNNER_TEMP/rubika-src/app/src/main/java" app/src/main/
          cp -a "$RUNNER_TEMP/rubika-src/app/src/main/assets" app/src/main/

      - name: Apply official Bot API v2 patch to extracted source
        run: |
          set -euo pipefail
          git apply --check patches/official-bot-v2.patch
          git apply patches/official-bot-v2.patch

      - name: Add explicit bridge to separately installed Rubika 4.1.1
        run: python3 scripts/add-official-rubika-bridge.py

      - name: Apply documented Bot API message options v3
        run: |
          set -euo pipefail
          python3 scripts/apply-bot-message-options-v3.py

      - name: Install opt-in free AI drafting assistant
        run: |
          set -euo pipefail
          python3 scripts/add-ai-assistant.py

      - name: Install additive AI discovery engine
        run: python3 scripts/add-ai-discovery.py

      - name: Install queue-start discovery integration
        run: python3 scripts/add-queue-start-discovery.py

      - name: Install message preflight and safe-dispatch policy
        run: python3 scripts/add-message-queue-policy.py

      - name: Install dependency-free plugin core
        run: python3 scripts/add-plugin-system.py

      - name: Test smart discovery ranking
        run: |
          mkdir -p "$RUNNER_TEMP/discovery-tests"
          javac -d "$RUNNER_TEMP/discovery-tests" overrides/ai-discovery/DiscoveryRanking.java tests/DiscoveryRankingTests.java
          java -cp "$RUNNER_TEMP/discovery-tests" ir.sinicable.rubikaqueue.DiscoveryRankingTests

      - name: Fix legacy orientation constants for Android lint
        run: python3 scripts/fix-mainactivity-orientation.py

      - name: Verify real application source
        run: |
          set -euo pipefail
          test -f app/src/main/java/ir/sinicable/rubikaqueue/MainActivity.java || {
            echo "::error::Android Java source missing. Upload the provided full Android Gradle source before building."; exit 1;
          }
          test -f app/src/main/java/ir/sinicable/rubikaqueue/SendInterval.java || { echo "::error::Missing v1.1 interval controller"; exit 1; }
          test -f app/src/main/java/ir/sinicable/rubikaqueue/QueueService.java || {
            echo "::error::QueueService.java missing; refusing to publish an empty app."; exit 1;
          }

      - name: Test online development gateway
        run: node tests/online-development-worker.test.mjs

      - name: Test personal desktop gateway authorization
        run: node tests/personal-gateway-auth.test.mjs

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test queue-start discovery policy
        run: |
          mkdir -p "$RUNNER_TEMP/queue-discovery-tests"
          javac -d "$RUNNER_TEMP/queue-discovery-tests" \
            overrides/ai-discovery/QueueStartDiscoveryPolicy.java \
            tests/QueueStartDiscoveryPolicyTests.java
          java -cp "$RUNNER_TEMP/queue-discovery-tests" ir.sinicable.rubikaqueue.QueueStartDiscoveryPolicyTests

      - name: Test queue-start discovery source integration
        run: python3 -m unittest discover -s tests -p 'test_queue_start_discovery_installer.py' -v

      - name: Test message preflight and safe-dispatch policy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/message-policy-tests"
          javac -d "$RUNNER_TEMP/message-policy-tests" \
            overrides/message-policy/MessageQueuePolicy.java \
            tests/MessageQueuePolicyTests.java
          java -cp "$RUNNER_TEMP/message-policy-tests" ir.sinicable.rubikaqueue.MessageQueuePolicyTests
          python3 -m unittest discover -s tests -p 'test_message_policy_installer.py' -v

      - name: Test optional-provider fallback, plugin lifecycle and workflows
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plugin-tests"
          javac -d "$RUNNER_TEMP/plugin-tests" overrides/plugin-system/*.java tests/PluginSystemTests.java
          java -cp "$RUNNER_TEMP/plugin-tests" ir.sinicable.rubikaqueue.PluginSystemTests

      - name: Test rate-limit retry backoff
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/rubika-src"
          mkdir -p "$RUNNER_TEMP/retry-tests"
          javac -d "$RUNNER_TEMP/retry-tests" "$src/app/src/main/java/ir/sinicable/rubikaqueue/RetryBackoff.java" "$src/tests/RetryBackoffTests.java"
          java -cp "$RUNNER_TEMP/retry-tests" ir.sinicable.rubikaqueue.RetryBackoffTests

      - name: Test manual Bot API update preview limits
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bot-tests"
          javac -d "$RUNNER_TEMP/bot-tests" \
            app/src/main/java/ir/sinicable/rubikaqueue/BotUpdatesPolicy.java \
            tests/BotUpdatesPolicyTests.java
          java -cp "$RUNNER_TEMP/bot-tests" ir.sinicable.rubikaqueue.BotUpdatesPolicyTests

      - name: Test Bot API message options
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/send-options-tests"
          javac -d "$RUNNER_TEMP/send-options-tests" \
            app/src/main/java/ir/sinicable/rubikaqueue/BotSendOptions.java \
            tests/BotSendOptionsTests.java
          java -cp "$RUNNER_TEMP/send-options-tests" ir.sinicable.rubikaqueue.BotSendOptionsTests

      - name: Test AI endpoint and draft policies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ai-policy-tests"
          javac -d "$RUNNER_TEMP/ai-policy-tests" \
            app/src/main/java/ir/sinicable/rubikaqueue/AiPromptPolicy.java \
            tests/AiPromptPolicyTests.java
          java -cp "$RUNNER_TEMP/ai-policy-tests" ir.sinicable.rubikaqueue.AiPromptPolicyTests

      - name: Test ChatGPT development report boundaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/report-tests"
          javac -d "$RUNNER_TEMP/report-tests" \
            overrides/ai-assistant/DevelopmentReportBuilder.java \
            tests/DevelopmentReportBuilderTests.java
          java -cp "$RUNNER_TEMP/report-tests" ir.sinicable.rubikaqueue.DevelopmentReportBuilderTests

      - name: Test APK update policy
        run: python3 -m unittest discover -s tests -p 'test_apk_update_policy.py' -v

      - name: Install Android platform from runner SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          printf 'y\n' | "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test discovery SQLite and HTTPS client
        run: gradle --no-daemon --max-workers=4 -p tests/discovery-runtime test

      - name: Restore owner signing key if configured
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          INSTALLED_P12_BASE64: ${{ secrets.RUBIKA_INSTALLED_KEYSTORE_BASE64 }}
          LEGACY_TEST_P12_BASE64: ${{ secrets.RUBIKA_TEST_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          umask 077
          if [ -n "$INSTALLED_P12_BASE64" ]; then
            printf '%s' "$INSTALLED_P12_BASE64" | base64 --decode > signing/test-signing.p12
            echo "installed" > signing/selected-key-origin
          elif [ -n "$LEGACY_TEST_P12_BASE64" ]; then
            printf '%s' "$LEGACY_TEST_P12_BASE64" | base64 --decode > signing/test-signing.p12
            echo "legacy-test" > signing/selected-key-origin
          else
            echo "::warning::No owner signing key is configured. Generated debug APK cannot update the installed code 14 app."
          fi

      - name: Build signed APK
        env:
          RUBIKA_TEST_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (secrets.RUBIKA_INSTALLED_KEYSTORE_PASSWORD || secrets.RUBIKA_TEST_KEYSTORE_PASSWORD) || '' }}
          RUBIKA_TEST_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (secrets.RUBIKA_INSTALLED_KEY_PASSWORD || secrets.RUBIKA_TEST_KEY_PASSWORD) || '' }}
          RUBIKA_TEST_KEY_ALIAS: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (secrets.RUBIKA_INSTALLED_KEY_ALIAS || secrets.RUBIKA_TEST_KEY_ALIAS) || 'test' }}
        run: |
          gradle wrapper --gradle-version 8.9
          if ! ./gradlew --no-daemon --max-workers=4 lintDebug assembleDebug; then
            find app/build -name 'lint-results-debug.txt' -type f -print -exec cat {} +
            exit 1
          fi

      - name: Verify APK signature and zip alignment
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk"
          # Verify the selected key against the exact known certificate, never an arbitrary signer.
          # Installed v1.3.1/code14 and legacy v1.1 use different keys.
          if [ -s signing/test-signing.p12 ]; then
            if [ "$(cat signing/selected-key-origin)" = 'installed' ]; then
              expected='fdb827fa66b05309a2e7a759bc03d9f22355b54cd74c63e74a5d889823087026'
            else
              expected='8747838d913e2f0f58dc66e432eb3753bc826e6a3f7e23eaf6bb799cd63af28b'
            fi
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | grep -qi "$expected"
          fi
          python3 scripts/apk_update_policy.py \
            --apk "$apk" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --installed-package 'ir.sinicable.rubikaqueue' \
            --installed-version-code 14 \
            --installed-certificate 'fdb827fa66b05309a2e7a759bc03d9f22355b54cd74c63e74a5d889823087026' \
            --report apk-update-report.json \
            --summary "$GITHUB_STEP_SUMMARY"
          classification="$(python3 -c 'import json; print(json.load(open("apk-update-report.json"))["classification"])')"
          if [ "$classification" = 'UPDATE_CANDIDATE_UNTESTED' ]; then
            cp "$apk" Rubika-Queu-v1.3.2-UPDATE-CANDIDATE-UNTESTED.apk
          else
            echo "::warning::Built APK cannot update the owner's installed v1.3.1 (code 14). Do not uninstall or clear app data."
            cp "$apk" Rubika-Queu-v1.3.2-NOT-UPDATABLE.apk
          fi

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Rubika-Queu-v1.3.2-apk
          path: |
            Rubika-Queu-v1.3.2-*.apk
            apk-update-report.json
          if-no-files-found: error
