name: Build Rubika Queu Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify real application source
        run: |
          set -euo pipefail
          test -f app/src/main/java/ir/sinicable/rubikaqueue/MainActivity.java || {
            echo "::error::Android Java source missing. Upload the provided full Android Gradle source before building."; exit 1;
          }
          test -f app/src/main/java/ir/sinicable/rubikaqueue/QueueService.java || {
            echo "::error::QueueService.java missing; refusing to publish an empty app."; exit 1;
          }

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent test signing key
        env:
          TEST_P12_BASE64: ${{ secrets.RUBIKA_TEST_KEYSTORE_BASE64 }}
        run: |
          test -n "$TEST_P12_BASE64" || {
            echo "::error::Missing RUBIKA_TEST_KEYSTORE_BASE64 GitHub Actions secret."; exit 1;
          }
          mkdir -p signing
          printf '%s' "$TEST_P12_BASE64" | base64 --decode > signing/test-signing.p12

      - name: Build signed APK
        env:
          RUBIKA_TEST_KEYSTORE_PASSWORD: ${{ secrets.RUBIKA_TEST_KEYSTORE_PASSWORD }}
          RUBIKA_TEST_KEY_PASSWORD: ${{ secrets.RUBIKA_TEST_KEY_PASSWORD }}
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew --no-daemon --max-workers=4 assembleDebug

      - name: Verify APK signature and zip alignment
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk"
          cp "$apk" Rubika-Queu-v0.8-test-signed.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Rubika-Queu-v0.8-test-signed-apk
          path: Rubika-Queu-v0.8-test-signed.apk
          if-no-files-found: error
