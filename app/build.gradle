plugins {
    id 'com.android.application'
}

// CI may substitute a disposable test keystore without touching the owner's key.
def stableKeyFile = rootProject.file(System.getenv('RUBIKA_STABLE_KEYSTORE_PATH') ?: 'signing/stable-release.p12')
// Dedicated, permanent signer for the *second* app. Never reuse the original app's key.
def sidecarKeyFile = rootProject.file(System.getenv('RUBIKA_SIDECAR_KEYSTORE_PATH') ?: 'signing/sidecar-stable-release.p12')

android {
    namespace 'ir.sinicable.rubikaqueue'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.sinicable.rubikaqueue'
        minSdk 26
        targetSdk 34
        versionCode 19
        versionName '1.5.0-full-dashboard'
    }

    signingConfigs {
        stableRelease {
            storeFile stableKeyFile
            storeType 'pkcs12'
            storePassword System.getenv('RUBIKA_STABLE_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('RUBIKA_STABLE_KEY_ALIAS') ?: ''
            keyPassword System.getenv('RUBIKA_STABLE_KEY_PASSWORD') ?: ''
        }
        sidecarStable {
            storeFile sidecarKeyFile
            storeType 'pkcs12'
            storePassword System.getenv('RUBIKA_SIDECAR_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('RUBIKA_SIDECAR_KEY_ALIAS') ?: ''
            keyPassword System.getenv('RUBIKA_SIDECAR_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        debug {
            // Install this diagnostic build alongside the existing Rubika queue.
            // Release identity, original namespace, and its data sandbox are untouched.
            applicationIdSuffix '.sidecar'
            versionNameSuffix '-sidecar-test'
            // CI debug APKs use Android's disposable per-run debug key only.
            minifyEnabled false
        }
        release {
            // Original-package release signing track remains unchanged.
            if (stableKeyFile.exists()) {
                signingConfig signingConfigs.stableRelease
            }
            minifyEnabled false
        }
        sidecarFull {
            initWith debug
            applicationIdSuffix '.sidecarfull'
            versionNameSuffix '-full-test'
            matchingFallbacks = ['debug']
            minifyEnabled false
        }
        sidecarStable {
            // A distinct *non-debuggable* release for the second app only.
            initWith release
            applicationIdSuffix '.sidecar'
            versionNameSuffix '-sidecar-stable'
            matchingFallbacks = ['release']
            signingConfig = sidecarKeyFile.exists() ? signingConfigs.sidecarStable : null
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
