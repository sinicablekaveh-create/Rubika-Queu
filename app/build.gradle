plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.sinicable.rubikaqueue'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.sinicable.rubikaqueue'
        minSdk 26
        targetSdk 34
        versionCode 18
        versionName '1.4.0-new-signing-track'
    }

    signingConfigs {
        stableRelease {
            storeFile rootProject.file('signing/stable-release.p12')
            storeType 'pkcs12'
            storePassword System.getenv('RUBIKA_STABLE_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('RUBIKA_STABLE_KEY_ALIAS') ?: ''
            keyPassword System.getenv('RUBIKA_STABLE_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        debug {
            // CI debug APKs use Android's disposable per-run debug key only.
            minifyEnabled false
        }
        release {
            // Only explicit, owner-provisioned, stable-release signing; never use debug keys.
            if (rootProject.file('signing/stable-release.p12').exists()) {
                signingConfig signingConfigs.stableRelease
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
