plugins {
    id 'com.android.application'
}

// CI may substitute a disposable test keystore without touching the owner's key.
def stableKeyFile = rootProject.file(System.getenv('RUBIKA_STABLE_KEYSTORE_PATH') ?: 'signing/stable-release.p12')

android {
    namespace 'ir.sinicable.rubikaqueue'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.sinicable.rubikaqueue'
        minSdk 26
        targetSdk 34
        versionCode 34
        versionName '1.6.3-queue-deep-reliability'
    }

    signingConfigs {
        stableRelease {
            storeFile stableKeyFile
            storeType 'pkcs12'
            storePassword System.getenv('RUBIKA_STABLE_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('RUBIKA_STABLE_KEY_ALIAS') ?: ''
            keyPassword System.getenv('RUBIKA_STABLE_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        debug {
            // Debug uses the requested application ID; a different signing certificate
            // CANNOT upgrade an existing installation with this same package ID.
            versionNameSuffix '-debug'
            // CI debug APKs use Android's disposable per-run debug key only.
            minifyEnabled false
        }
        release {
            // Only explicit, owner-provisioned, stable-release signing; never use debug keys.
            if (stableKeyFile.exists()) {
                signingConfig signingConfigs.stableRelease
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Local JVM tests for the untrusted Hooshika handoff parser.
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
