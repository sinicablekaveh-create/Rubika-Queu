plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.sinicable.rubikaqueue'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.sinicable.rubikaqueue'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5-test'
    }

    signingConfigs {
        debug {
            storeFile file('test-signing.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
